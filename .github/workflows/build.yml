name: Build-OpenWrt-EasyTier

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 Releases 的版本号（留空则不发布）'
        required: false
        default: '2.7.0'
      text:
        description: '发布说明'
        required: false
        default: 'EasyTier 2.7.0 for QWRT 25.12.2 aarch64_cortex-a53 (IPK)'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TAG: "${{ github.event.inputs.tag }}"
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
        sdk:
          - 22.03.7

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            /opt/openwrt-sdk-${{ matrix.arch }}-${{ matrix.sdk }}
            dl
          key: sdk-${{ matrix.arch }}-${{ matrix.sdk }}

      - name: Create i18n uci-defaults file
        run: |
          mkdir -p luci-app-easytier/root/etc/uci-defaults
          cat > luci-app-easytier/root/etc/uci-defaults/luci-i18n-easytier-zh-cn << 'EOF'
          #!/bin/sh
          uci -q batch << EOI
          set luci.languages.zh_cn='简体中文 (Simplified Chinese)'
          commit luci
          EOI
          rm -f /tmp/luci-indexcache /tmp/luci-modulecache/*
          exit 0
          EOF
          chmod +x luci-app-easytier/root/etc/uci-defaults/luci-i18n-easytier-zh-cn

      - name: Building packages
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: easytier easytier-noweb luci-app-easytier
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          MAKEFLAGS: -j$(nproc)
          V: s

      - name: Generate package guide
        run: |
          PKG_DIR="bin/packages/${{ matrix.arch }}/packages_ci"
          EASYTIER_VERSION="$(awk -F= '/^EASYTIER_VERSION=/{print $2}' version.mk)"
          mkdir -p "$PKG_DIR"
          cat > "$PKG_DIR/README_PACKAGE.md" << EOF
          # EasyTier OpenWrt 安装包说明

          构建目标: \`${{ matrix.arch }}-${{ matrix.sdk }}\`
          EasyTier 版本: \`${EASYTIER_VERSION:-2.7.0}\`
          适用系统: QWRT 25.12.2 / OpenWrt 22.03 (opkg)
          架构: aarch64_cortex-a53

          ## 包说明

          - \`easytier_*.ipk\`: EasyTier 核心程序（含 Web 控制台）
          - \`easytier-noweb_*.ipk\`: EasyTier 核心程序（不含 Web 控制台，省空间）
          - \`luci-app-easytier_*.ipk\`: LuCI 管理界面
          - \`luci-i18n-easytier-zh-cn_*.ipk\`: 简体中文语言包

          ## 安装方法

          将所有 .ipk 文件上传到路由器 /tmp 目录，然后执行：

          \`\`\`sh
          opkg update
          opkg install kmod-tun
          opkg install /tmp/easytier_*.ipk
          opkg install /tmp/luci-app-easytier_*.ipk
          opkg install /tmp/luci-i18n-easytier-zh-cn_*.ipk
          \`\`\`

          如果存储空间紧张，用 noweb 版本替代：

          \`\`\`sh
          opkg install /tmp/easytier-noweb_*.ipk
          opkg install /tmp/luci-app-easytier_*.ipk
          opkg install /tmp/luci-i18n-easytier-zh-cn_*.ipk
          \`\`\`

          ## 安装后

          - 刷新 LuCI 或重新登录
          - 打开 VPN -> EasyTier 配置
          - 查看日志: \`logread | grep -i easytier\`

          ## 常见问题

          - LuCI 菜单不显示: \`rm -f /tmp/luci-indexcache /tmp/luci-modulecache/*\` 然后重新登录
          - 服务无法启动: 确认 \`kmod-tun\` 已安装，执行 \`/etc/init.d/easytier restart\`
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.tag != '' }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release info
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/*; do
            name=$(basename "$dir")
            files=("$dir"/*.ipk "$dir"/*.md)
            if [ ${#files[@]} -gt 0 ]; then
              zip -j "release/EasyTier-${{ env.TAG }}-${name}.zip" "${files[@]}"
            fi
          done
          echo "build_time=$(TZ=UTC-8 date '+%Y年%m月%d日%H:%M:%S')" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## EasyTier ${{ env.TAG }} for OpenWrt

            > 编译时间: ${{ env.build_time }}

            ### 适用设备
            - 架构: \`aarch64_cortex-a53\`
            - 固件: QWRT 25.12.2 / OpenWrt 22.03 (opkg)
            - 包格式: **IPK**

            ### 安装
            1. 下载解压，将所有 \`.ipk\` 上传到路由器 \`/tmp\`
            2. 执行:
               \`\`\`sh
               opkg update
               opkg install kmod-tun
               opkg install /tmp/easytier_*.ipk
               opkg install /tmp/luci-app-easytier_*.ipk
               opkg install /tmp/luci-i18n-easytier-zh-cn_*.ipk
               \`\`\`
            3. 刷新 LuCI，进入 VPN -> EasyTier

            ${{ github.event.inputs.text }}
          tag_name: ${{ env.TAG }}
          files: release/*.zip
